<main>
  <section id="grid" class="arcade-grid" aria-label="Games">
    <button class="game-card featured" type="button" data-game="quest">
      <span class="preview"><canvas class="game-canvas" data-preview="quest" width="320" height="120" aria-hidden="true"></canvas></span>
      <span class="card-body">
        <span class="card-badge">New · 3 levels</span>
        <span class="card-title">Bunny Quest</span>
        <span class="card-text">A three-level platformer: run, jump, stomp the bugs, bump the ? blocks and grab the flagpole.</span>
        <span class="card-meta"><span>Best <b data-best="quest">0</b></span><span class="play">Play ▶</span></span>
      </span>
    </button>
    <button class="game-card" type="button" data-game="runner">
      <span class="preview"><canvas class="game-canvas" data-preview="runner" width="240" height="90" aria-hidden="true"></canvas></span>
      <span class="card-body">
        <span class="card-title">Bug Runner</span>
        <span class="card-text">Jump the bugs, grab the commits and stay low under the flying ones. How far can you run?</span>
        <span class="card-meta"><span>Best <b data-best="runner">0</b></span><span class="play">Play ▶</span></span>
      </span>
    </button>
    <button class="game-card" type="button" data-game="fish">
      <span class="preview"><canvas class="game-canvas" data-preview="fish" width="320" height="120" aria-hidden="true"></canvas></span>
      <span class="card-body">
        <span class="card-title">Catch the Fish</span>
        <span class="card-text">Hook every bite the moment you see the “!”. 60 seconds, golden fish and sneaky boots.</span>
        <span class="card-meta"><span>Best <b data-best="fish">0</b></span><span class="play">Play ▶</span></span>
      </span>
    </button>
    <button class="game-card" type="button" data-game="deploy">
      <span class="preview"><canvas class="game-canvas" data-preview="deploy" width="320" height="120" aria-hidden="true"></canvas></span>
      <span class="card-body">
        <span class="card-title">Deploy Pipeline</span>
        <span class="card-text">Hit the green window to get the build through lint, test, build and deploy.</span>
        <span class="card-meta"><span>Best <b data-best="deploy">0</b></span><span class="play">Play ▶</span></span>
      </span>
    </button>
    <h2 class="grid-label" id="moreGames">More games</h2>
    <button class="game-card more" type="button" data-game="carrots">
      <span class="preview"><canvas class="game-canvas" data-preview="carrots" width="320" height="120" aria-hidden="true"></canvas></span>
      <span class="card-body">
        <span class="card-title">Carrot Harvest</span>
        <span class="card-text">Pull the carrots before they sink back into the field, and leave the bugs alone. 45 seconds.</span>
        <span class="card-meta"><span>Best <b data-best="carrots">0</b></span><span class="play">Play ▶</span></span>
      </span>
    </button>
    <button class="game-card more" type="button" data-game="eggs">
      <span class="preview"><canvas class="game-canvas" data-preview="eggs" width="320" height="120" aria-hidden="true"></canvas></span>
      <span class="card-body">
        <span class="card-title">Egg Catch</span>
        <span class="card-text">Slide the basket under the hens, grab the golden eggs and dodge the rotten ones.</span>
        <span class="card-meta"><span>Best <b data-best="eggs">0</b></span><span class="play">Play ▶</span></span>
      </span>
    </button>
    <button class="game-card more" type="button" data-game="snake">
      <span class="preview"><canvas class="game-canvas" data-preview="snake" width="320" height="120" aria-hidden="true"></canvas></span>
      <span class="card-body">
        <span class="card-title">Bunny Hop</span>
        <span class="card-text">Lead a growing line of baby bunnies to the carrots without crashing.</span>
        <span class="card-meta"><span>Best <b data-best="snake">0</b></span><span class="play">Play ▶</span></span>
      </span>
    </button>
    <button class="game-card more" type="button" data-game="memory">
      <span class="preview"><canvas class="game-canvas" data-preview="memory" width="320" height="120" aria-hidden="true"></canvas></span>
      <span class="card-body">
        <span class="card-title">Memory Match</span>
        <span class="card-text">Eight pairs from around the arcade. Fewer moves and less time score higher.</span>
        <span class="card-meta"><span>Best <b data-best="memory">0</b></span><span class="play">Play ▶</span></span>
      </span>
    </button>
    <button class="game-card more" type="button" data-game="flap">
      <span class="preview"><canvas class="game-canvas" data-preview="flap" width="320" height="120" aria-hidden="true"></canvas></span>
      <span class="card-body">
        <span class="card-title">Bunny Flap</span>
        <span class="card-text">Propeller hat on. Thread the bunny between the server racks.</span>
        <span class="card-meta"><span>Best <b data-best="flap">0</b></span><span class="play">Play ▶</span></span>
      </span>
    </button>
    <button class="game-card more" type="button" data-game="queue">
      <span class="preview"><canvas class="game-canvas" data-preview="queue" width="320" height="120" aria-hidden="true"></canvas></span>
      <span class="card-body">
        <span class="card-title">Queue Sorter</span>
        <span class="card-text">Route GETs, POSTs and 500 errors to the right server before the queue overflows.</span>
        <span class="card-meta"><span>Best <b data-best="queue">0</b></span><span class="play">Play ▶</span></span>
      </span>
    </button>
  </section>

  <section id="view" class="game-view" hidden>
    <div class="view-bar">
      <a class="back-link" id="back" href="arcade.html">← All games</a>
      <span class="view-keys" id="keys"></span>
      <span class="rotate-hint">Turn sideways for a bigger game</span>
    </div>
    <div class="stage" id="stage" aria-label="Game">
      <div class="hud" id="hud" role="group" aria-label="Scoreboard"></div>
      <div class="field" id="field">
        <div class="overlay" id="overlay">
          <span class="ribbon" id="overlayRibbon" hidden>New best!</span>
          <h2 id="overlayTitle"></h2>
          <div class="end-score" id="overlayScore" hidden></div>
          <div class="end-stars" id="overlayStars" hidden></div>
          <div class="end-stats" id="overlayStats" hidden></div>
          <p id="overlayText"></p>
          <span class="tap-cta" id="overlayCta" aria-hidden="true">Tap to play</span>
        </div>
        <div class="countdown" id="countdown" aria-hidden="true" hidden></div>
        <button class="full-btn snd-btn" id="sndBtn" type="button" aria-pressed="false" aria-label="Sound off. Turn sound on" title="Sound (M)"><svg class="ico-on" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" shape-rendering="crispEdges"><path d="M2 6h3l4-4v12l-4-4H2zM11 5h1v6h-1zM13 3h1v10h-1z" fill="currentColor"/></svg><svg class="ico-off" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" shape-rendering="crispEdges"><path d="M2 6h3l4-4v12l-4-4H2zM11 6h1v1h1V6h1v1h-1v1h1v1h-1v1h1v1h-1v-1h-1v1h-1v-1h1V9h-1V8h1V7h-1z" fill="currentColor"/></svg></button>
        <button class="full-btn" id="fullBtn" type="button" aria-pressed="false" aria-label="Full screen" title="Full screen (F)"><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" shape-rendering="crispEdges"><path d="M1 1h5v2H3v3H1zM10 1h5v5h-2V3h-3zM1 10h2v3h3v2H1zM13 10h2v5h-5v-2h3z" fill="currentColor"/></svg></button>
      </div>
      <p class="sr" id="status" role="status" aria-live="polite"></p>
    </div>
    <section class="card">
      <h2>How to play</h2>
      <ul class="rules" id="rules"></ul>
    </section>
  </section>
</main>
